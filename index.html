<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
          crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="./css/style.css" type="text/css">
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📧</text></svg>"
    />
    <title>Random e-Mail Generator</title>
</head>
<body>
    <header class="py-2 ps-4">
        <h1 class>Random e-Mail Generator</h1>
        <h4>Il tuo generatore di mail casuali 🤫</h2>
    </header>

    <main>
        <div class="container d-flex flex-column align-items-center gap-4 mt-4">
            <p class="text-center">👇 Clicca il bottone per generare una lista di <strong>10 mail</strong> casuali! 👇 <br>
            I tuoi affari loschi sono al sicuro con una mail anonima
            </p>
            <button class="btn btn-success"><i class="bi bi-arrow-clockwise px-1"></i>Genera mail casuali</button>
            <p id="status" class="alert alert-warning d-none">⌛ Caricamento... </p>
            <ul id="mail-list" class="list-unstyled text-white bg-success border rounded p-4 d-none">
            <!-- list item added by script.js -->
            </ul>
        </div>
    </main>
    
<!-- Script -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="./js/script.js"></script>
</body>
</html>
